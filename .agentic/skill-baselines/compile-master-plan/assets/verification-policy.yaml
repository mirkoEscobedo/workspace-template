schema_version: 1
levels:
  L0:
    purpose: static checks
    examples: [format, lint, typecheck, compile]
  L1:
    purpose: exact new or repaired behavior
  L2:
    purpose: affected module or package
  L3:
    purpose: affected integration shard or integration wave
  L4:
    purpose: full repository baseline
policy:
  red_green: [L1]
  implementer_handoff: [L0, L1, L2]
  normal_repair: [L0, L1, L2]
  integration_wave: [L3]
  lane_3_landing: [L0, L1, L2, L3, L4]
  lane_0_1_full_suite: batch_at_wave
