name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: npm pack --dry-run --json --cache .tmp/npm-cache

  source-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject JavaScript product and generated projections
        shell: bash
        run: |
          test ! -d src
          test ! -d test
          test ! -d .agentic
          test ! -d .agents
          test ! -d .codex
          test ! -d .opencode
          test ! -d assets/presets
          test ! -d assets/configs
          ! find scripts -type f -name '*.js' -print -quit | grep -q .

  linux-x64-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --bin workspace-template
      - name: Confirm Linux remains gated until packed full-parity qualification
        shell: bash
        run: |
          cargo run --quiet -- version
          set +e
          cargo run --quiet -- inspect . >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 69
