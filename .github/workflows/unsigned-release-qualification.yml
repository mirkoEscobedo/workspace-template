name: unsigned-release-qualification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/0.9-cleanup

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Reproducible unsigned materialization and SBOM
        shell: powershell
        run: ./scripts/build-native-release.ps1
      - name: Windows Defender rescan of unsigned executable
        shell: powershell
        run: Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path ./bin/workspace-template.exe)
      - name: Packed npm and pnpm development qualification
        shell: powershell
        run: ./scripts/test-native-packed.ps1 -AllowUnsignedDevelopment
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-template-0.9.0-alpha.0-unsigned-windows-x64
          if-no-files-found: error
          path: |
            bin/workspace-template.exe
            workspace-template.provenance.json
            workspace-template.sbom.json

# Signing, RFC 3161 timestamping, signed-byte scanning, GitHub attestations,
# release creation, registry publication, and dist-tags are intentionally absent.
# They require the separate human authorities recorded in release readiness.
