schema_version: 1
file_defaults:
  test_warn_loc: 500
  test_split_plan_loc: 1000
  test_block_growth_loc: 1500
  new_test_file_hard_limit_loc: 2000
  production_warn_loc: 800
  production_split_plan_loc: 1500
patch_defaults:
  added_test_loc_to_locked_file: 0
  require_new_test_module_added_loc: 250
concentration:
  warn_top_10_share: 0.40
locked_files: {}
source_extensions:
  - .py
  - .pyi
  - .rs
  - .ts
  - .tsx
  - .mts
  - .cts
  - .js
  - .jsx
  - .mjs
  - .cjs
  - .go
  - .java
  - .kt
  - .kts
  - .cs
  - .cpp
  - .cc
  - .cxx
  - .c
  - .h
  - .hpp
  - .swift
  - .rb
  - .php
  - .scala
  - .ex
  - .exs
test_globs:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/tests/**/*.rs"
  - "**/*_tests.rs"
  - "**/*_test.go"
  - "**/*Test.java"
ignore_globs:
  - "**/.git/**"
  - "**/.hg/**"
  - "**/.svn/**"
  - "**/node_modules/**"
  - "**/target/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
