schema_version: 1
ownership:
  lease_dir: .agent/leases
  require_run_id: true
  require_ticket_id: true
postconditions:
  zero_owned_processes: true
  zero_open_leases: true
termination:
  graceful_seconds: 8
  kill_after_seconds: 15
limits:
  max_subagents: 3
  max_write_agents: 1
  max_processes_per_ticket: 128
