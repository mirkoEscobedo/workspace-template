schema_version: 1
levels:
  L0: {purpose: static checks}
  L1: {purpose: exact changed behavior}
  L2: {purpose: affected module or package}
  L3: {purpose: packed or integration wave}
  L4: {purpose: full repository baseline}
policy:
  red_green: [L1]
  implementer_handoff: [L0, L1, L2]
  normal_repair: [L0, L1, L2]
  integration_wave: [L3]
  lane_3_landing: [L0, L1, L2, L3, L4]
upgrade_runtime:
  before_mutation: [L4]
  after_mutation: [L4]
  unavailable_required_command: blocked
