schema_version: 1
id: UPG-005
title: Legacy and workspace compatibility
legacy_ids: []
status: closed
parent: null
public_outcome: Supported generated, adopted, legacy, monorepo, and non-Git workspaces upgrade without product or durable-memory mutation.
behaviors:
  - preserve all doctor-supported schema generations
  - upgrade generated and adopted workspace origins
  - retain workspace module identity and dependency state
  - reject ambiguous unsupported and unsafe states
  - produce an exact no-op on the second upgrade
invariants:
  - product and durable memory remain byte-identical
  - mode is never inferred from application layout
out_of_scope:
  - unknown future schemas
  - automatic adoption of unmanaged repositories
blocked_by:
  - UPG-004
risk_lane: 3
preflight_required: true
read_set:
  - src/doctor.js
  - src/inspection.js
  - src/workspace/**
  - src/upgrade/**
write_set:
  - src/upgrade/**
  - src/doctor.js
  - test/upgrade-compatibility.test.js
  - test/helpers.js
conflict_keys:
  - legacy-schema-migration
  - workspace-module-state
  - durable-planning-memory
  - upgrade-plan-shape
skills:
  - tdd
  - test-topology
  - implementation-style
  - process-lifecycle
  - verify
human_gates: []
stop_conditions:
  - compatibility requires guessing origin or overwriting unowned state
commit_policy: coordinator
review_lenses:
  - spec-authority
  - code-test
  - operations-security
verification:
  red:
    - npm run test -- test/upgrade-compatibility.test.js
  repair_levels:
    - L0
    - L1
    - L2
    - L3
  landing_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
  commands:
    - npm run test -- test/upgrade-compatibility.test.js
    - npm run check
  native_checks: []
budgets:
  locked_files:
    - test/adopt.test.js
  max_new_test_file_loc: 700
  max_new_production_file_loc: 600
  zero_owned_processes_after_run: true
