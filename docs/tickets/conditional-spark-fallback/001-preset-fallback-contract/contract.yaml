schema_version: 1
id: FBK-001
title: Preset fallback contract and truthful routing
legacy_ids: []
status: closed
parent: null
public_outcome: sol-codex can describe and atomically materialize a truthful conditional Spark fallback while sol-only and legacy presets remain broker-free and compatible.
behaviors:
  - accept the exact optional fallbacks.codexChildModelRefusal object and reject unknown kinds, roles, aliases, targets, missing bindings, duplicates, or malformed values
  - resolve terra-medium to GPT-5.6 Terra medium and all seven eligible semantic roles to native and OpenCode GPT-5.3 Codex Spark xhigh while coordinator and planner remain Sol high
  - allocate a deterministic collision-safe native transport broker role ID, preferring opencode_spark_broker, only when the active preset declares the fallback
  - render config, profile, and model-routing state with the resolved broker role ID and model, eligible roles, delegate target, OpenCode role IDs, models, and reasoning variants
  - preserve the sol-only definition, default selection, current fingerprint, and absence of broker output
  - plan and apply the complete preset artifact set atomically with precondition checks and exact-byte rollback across broker files, expanded state, reports, and managed manifest
  - persist a durable preset transaction journal before mutation, make later planning fail closed while recovery is pending, recover interrupted transactions before a later apply, and clear the journal only after the manifest-last commit or exact recovery
  - keep durable recovery snapshots in a self-ignored, access-restricted transaction directory so user configuration bytes are never copied into a committable report or journal
  - reject symlink or junction ancestors and perform mutations through a directory-pinned boundary so ancestor replacement cannot redirect writes, deletion, or rollback outside the repository
  - recreate missing managed parent directories transactionally and remove only generator-created empty parents during rollback
  - distinguish pending, tool-authored, already-restored, and third-party-drifted journal entries so recovery never overwrites bytes the tool did not author
  - predeclare recovery snapshots and created-parent ownership durably before they can outlive their worker, and durably mark a committed transaction before cleanup can remove rollback bytes
  - keep every credential-bearing product, restore, and snapshot stage inside the self-ignored access-restricted private store, keep the metadata-only bootstrap journal outside it, and require an explicit worker accept acknowledgement after durable ownership sealing
  - preserve user-owned or drifted artifacts through the existing partial/conflict policy and never delete or overwrite an unowned collision
invariants:
  - fallback metadata is optional in preset version 1
  - coordinator and planner are never eligible
  - the broker is transport-only and is not added to PRESET_ROLES
  - active state never claims a broker or fallback route that was not materialized
  - .agentic/managed-files.json commits last and rollback restores prior bytes and prior absence
  - preset apply has one exclusive workspace writer; an uncooperative same-directory leaf mutation after the worker's final identity check is outside the portable Node atomicity contract and is treated as workspace corruption if observed afterward
  - active routing remains sol-only with fingerprint 793606dafbcd5571feb039beaad992c501952fe7a8d33a913a035653a10420b6 throughout this ticket
out_of_scope:
  - running OpenCode
  - coordinator refusal handling
  - activating sol-codex in this repository
  - release bump, push, publish, or deploy
blocked_by: []
risk_lane: 3
preflight_required: true
read_set:
  - .agentic/policies/model-routing.yaml
  - .agentic/presets/**
  - assets/presets/**
  - assets/configs/codex/**
  - assets/configs/opencode/**
  - src/presets/**
  - src/plans/**
  - src/checkpoints/**
  - src/tooling/structured-edit.js
  - test/configuration.test.js
  - test/presets.test.js
write_set:
  - assets/presets/preset.schema.json
  - assets/presets/builtin/sol-codex.json
  - assets/configs/codex/agents/opencode-spark-broker.toml
  - src/presets/**
  - test/preset-fallback.test.js
  - test/preset-fallback-security.test.js
  - test/preset-fallback-process.test.js
  - test/configuration.test.js
  - test/presets.test.js
  - test/adopt.test.js
  - docs/tickets/conditional-spark-fallback/001-preset-fallback-contract/evidence/result.md
conflict_keys:
  - preset-version-1-schema
  - builtin-sol-codex-definition
  - preset-fingerprint-algorithm
  - resolved-routing-state-shape
  - generated-codex-agent-ids
  - preset-apply-transaction
  - managed-artifact-manifest
skills:
  - tdd
  - test-topology
  - implementation-style
  - process-lifecycle
  - verify
human_gates:
  - Any release bump, push, publish, deploy, or remote mutation requires separate explicit human authorization and is outside this ticket.
stop_conditions:
  - sol-only content, fingerprint, default selection, or broker absence would change
  - preset version 1 compatibility cannot be preserved
  - a broker collision would require overwriting or deleting user-owned content
  - atomic apply cannot roll back broker, state, report, and managed-manifest paths exactly
  - the active repository preset changes before FBK-006
  - writes are needed outside the frozen set without contract repair
commit_policy: coordinator
review_lenses:
  - spec-authority
  - code-test
  - operations-security
verification:
  red:
    - node --test test/preset-fallback.test.js
  repair_levels: [L0, L1, L2, L3]
  landing_levels: [L0, L1, L2]
  commands:
    - node --test test/preset-fallback.test.js
    - node --test test/configuration.test.js test/presets.test.js
    - npm run lint
    - workspace-template preset status . --json
  native_checks:
    - atomic preset apply failure injection restores exact prior bytes and absence for broker, expanded state, report, and managed manifest
    - interrupted transaction recovery restores exact prior bytes or completes the sealed manifest-last commit before later work
    - chained filename and role-ID collisions preserve every unowned byte and allocate deterministically
    - parent symlink or junction and preflight-to-write substitution cases fail closed without external writes
    - schema and runtime validators reject the same malformed fallback fixtures
    - schema and runtime validators reject wrong Terra/Spark model IDs and reasoning variants under the reserved fallback aliases
    - OpenCode partial override apply followed by sol-only deactivation leaves no orphaned generator broker
    - invalid persisted broker role IDs cannot traverse outside the direct .codex/agents directory
    - missing managed parent directories are recreated on apply and generator-created empty parents are removed on rollback
    - transaction snapshots are self-ignored, access-restricted, absent from reports, and recovery preserves third-party drift
    - crash before snapshot or created-parent sealing leaves no unreferenced recovery bytes or unowned directories
    - crash during committed-transaction cleanup resumes cleanup without attempting rollback
    - crash during private-store bootstrap or staging leaves only journal-owned paths that recovery removes
    - the single pre-journal bootstrap stage is metadata-only; any residue or pre-existing collision is preserved and fails closed because ownership cannot be proven before the canonical journal exists
    - preset status confirms the repository remains on the baseline sol-only fingerprint
budgets:
  locked_files:
    - src/process-utils.js
    - test/adopt.test.js
    - test/presets.test.js
    - test/skills-update.test.js
  max_new_test_file_loc: 700
  max_new_production_file_loc: 600
  zero_owned_processes_after_run: true
repair_amendments:
  - id: fbk-001-preset-assertion-2026-07-26
    status: authorized
    reason: The approved sol-codex migration makes the locked gpt-5.3-codex/high assertion obsolete; the required regression gate cannot pass without an assertion-only Spark/xhigh update.
    write_set_additions:
      - test/presets.test.js
      - test/adopt.test.js
    constraints:
      - assertion-only semantic update for the approved sol-codex model and reasoning variant
      - test/presets.test.js remains exactly 139 LOC
      - test/adopt.test.js remains exactly 380 LOC
      - no new legacy-test behavior or test-file growth
  - id: fbk-001-independent-review-repair-2026-07-26
    status: authorized
    reason: Independent reviews found chained path collisions, false Codex partial-state claims, schema/runtime parity gaps, and crash/symlink atomicity gaps within the existing FBK-001 product boundary.
    write_set_additions:
      - docs/tickets/conditional-spark-fallback/001-preset-fallback-contract/evidence/result.md
    constraints:
      - product repairs remain inside the original src/presets, preset asset, and focused-test paths
      - new boundary-heavy regressions belong in test/preset-fallback-security.test.js so test/preset-fallback.test.js does not exceed its 700-LOC budget
      - process-lease and temporary-fixture lifecycle regressions may move to test/preset-fallback-process.test.js so each focused file remains below 700 LOC
      - no sol-codex activation, OpenCode execution, release mutation, or remote action
      - L3 and L4 are integration-wave gates deferred to FBK-005 because installed inactive catalog materialization is owned there
  - id: fbk-001-second-independent-review-repair-2026-07-26
    status: authorized
    reason: The repaired candidate still accepted wrong pinned routes, orphaned a broker under OpenCode partial state, regressed missing-directory repair, trusted unsafe persisted role IDs, exposed recoverable snapshots to accidental commit, and could overwrite third-party drift during recovery.
    constraints:
      - product repairs remain inside the original src/presets, preset asset, and focused-test paths
      - transaction recovery must preserve both exact rollback and any bytes not authored by the transaction
      - filesystem mutation must be directory-pinned on Windows and POSIX without a new runtime dependency
      - recovery data must be self-ignored and access-restricted without modifying user-owned repository ignore files
      - no sol-codex activation, OpenCode execution, release mutation, or remote action
  - id: fbk-001-third-independent-review-repair-2026-07-26
    status: authorized
    reason: Review found unsealed snapshot and created-parent crash windows, unsafe cleanup ordering, missing-parent identity substitution, worker reaping gaps, and a vacuous broker-retirement oracle.
    constraints:
      - predeclare snapshot paths in the initial durable journal and seal created-parent ownership before the worker accepts a mutation
      - committed transactions resume cleanup rather than rollback if cleanup is interrupted
      - worker validation failures synchronously close and reap the exact child identity
      - missing-parent creation must compare the created identity with the pinned post-chdir identity
      - broker retirement regression must begin from a fully materialized sol-codex state
      - portable atomicity assumes the existing exclusive-workspace-writer invariant; do not claim protection from an uncooperative same-directory leaf replacement after the final supported identity boundary
      - no sol-codex activation in this repository, OpenCode execution, release mutation, or remote action
  - id: fbk-001-fourth-independent-review-repair-2026-07-26
    status: authorized
    reason: Review found unjournaled random staging files, private-store content written before durable ownership, and no explicit worker acknowledgement after ownership sealing.
    constraints:
      - the durable bootstrap journal is metadata-only and remains outside the self-ignored snapshot directory
      - every staging path is deterministic, transaction-unique, predeclared, and cleaned only as an exact transaction-owned path
      - snapshot creation must not use an undeclared temporary path
      - the worker must acknowledge durable ownership acceptance before any owned directory content or product mutation
      - recovery treats a sealed-but-already-absent generator-created parent as already restored
      - no sol-codex activation in this repository, OpenCode execution, release mutation, or remote action
  - id: fbk-001-fifth-independent-review-repair-2026-07-26
    status: authorized
    reason: Review found credential-bearing adjacent stages, non-atomic first-journal and ignore-marker writes, and missing exact coverage of the post-seal/pre-accept crash interval.
    constraints:
      - product and restore stages live only in the ignored ACL-restricted private transaction store and are moved atomically to directory-pinned destinations
      - the private-store ignore marker is installed through a journal-declared private stage before any credential-bearing bytes
      - one fixed generator-reserved metadata-only bootstrap stage may precede the journal; planning/recovery cleans it safely even when its JSON is partial
      - the canonical external journal is installed by atomic rename from that bootstrap stage
      - sealed-but-absent created parents are accepted as already restored in recovery
      - add exact hard-crash coverage after journal parent seal and before worker accept
      - no sol-codex activation in this repository, OpenCode execution, release mutation, or remote action
  - id: fbk-001-sixth-independent-review-repair-2026-07-26
    status: authorized
    reason: Review proved pre-journal bootstrap ownership is unknowable after a partial crash, found the preset worker lacks the future FBK-002 generic Job Object control plane, and found temporary security fixtures were not cleaned.
    constraints:
      - never delete or overwrite an existing bootstrap stage without canonical-journal ownership; preserve it and fail closed with the exact recovery path
      - a pre-journal crash may require manual removal of the metadata-only bootstrap residue, but must leave no credential bytes, product writes, private store, or live process
      - automatic transaction recovery begins only after the canonical metadata journal exists
      - until FBK-002 supplies the generic Windows Job Object runner, preset mutation workers and their fixed ACL child use exact durable PID/start-identity leases, bounded deadlines, explicit reaping, and zero-descendant proof
      - FBK-001 must not implement the generic managed-command/Job Object control plane owned by FBK-002
      - every temporary workspace created by FBK-001 tests is removed after the suite, including hard-crash branches
      - no sol-codex activation in this repository, OpenCode execution, release mutation, or remote action
