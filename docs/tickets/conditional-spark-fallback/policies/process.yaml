schema_version: 1
scope: repository-local verification and preset materialization
runtime_orchestration:
  owner: ultima-ai
  local_control_plane: forbidden
  local_refusal_circuit: forbidden
  local_broker_execution: forbidden
  local_opencode_spawn: forbidden
  local_runtime_routing_state: forbidden
postconditions:
  zero_owned_processes: true
  zero_open_leases: true
limits:
  max_subagents: 3
  max_write_agents: 1
safety:
  kill_by_executable_name: forbidden
  broad_environment_dump: forbidden
  credential_dump: forbidden
