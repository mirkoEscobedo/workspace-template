schema_version: 1
levels:
  L0:
    purpose: static and diff checks
    commands:
      - npm run lint
      - git diff --check
  L1:
    purpose: retained FBK-001 preset behavior
    commands:
      - node --test test/preset-fallback.test.js test/preset-fallback-process.test.js test/preset-fallback-security.test.js
  L2:
    purpose: affected preset, workspace, and ownership wording
    commands:
      - node --test test/configuration.test.js test/presets.test.js test/create.test.js test/adopt.test.js test/upgrade-artifacts.test.js test/upgrade-plan.test.js test/process-utils.test.js test/args.test.js
  L3:
    purpose: package and packed integration
    commands:
      - npm run pack:check
      - npm run test:packed
      - node bin/workspace-template.js doctor . --json
      - node bin/workspace-template.js preset status . --json
  L4:
    purpose: full repository baseline
    commands:
      - npm run check
policy:
  retained_ticket_levels:
    FBK-001: [L0, L1, L2]
  superseded_tickets:
    - FBK-002
    - FBK-003
    - FBK-004
    - FBK-005
    - FBK-006
  ticket_pack_commands:
    - python -B assets/scripts/validate_ticket_pack.py docs/tickets/conditional-spark-fallback --json
    - python -B assets/scripts/check_architecture_budgets.py --root . --config docs/tickets/conditional-spark-fallback/policies/architecture-budgets.yaml
  live_model_commands: []
  active_preset_must_remain:
    id: sol-only
    fingerprint: 793606dafbcd5571feb039beaad992c501952fe7a8d33a913a035653a10420b6
